<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareerMate AI - AI-Powered Career Co-Pilot</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel standalone for JSX processing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeIn 0.35s ease-out forwards; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- SVG Icon Components ---
    const IconBrain = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 14l9-5-9-5-9 5 9 5z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0112 20.055a11.952 11.952 0 01-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/></svg>
    );
    const IconBriefcase = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 13V6a2 2 0 00-2-2H5a2 2 0 00-2 2v7m18 0v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5m18 0h-5a2 2 0 00-2 2v0a2 2 0 01-2 2H9a2 2 0 01-2-2v0a2 2 0 00-2-2H3"/></svg>
    );
    const IconFileText = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
    );
    const IconMessage = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
    );
    const IconPlus = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
    );
    const IconSparkles = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>
    );
    const IconCheck = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"/></svg>
    );

    // --- MAIN APPLICATION COMPONENT ---
    function App() {
      const [view, setView] = useState('landing'); // 'landing' or 'app'
      const [tab, setTab] = useState('dashboard');
      
      // Job applications state with LocalStorage persistence
      const [jobs, setJobs] = useState(() => {
        const saved = localStorage.getItem('careermate_jobs');
        return saved ? JSON.parse(saved) : [
          { id: 1, company: 'Google', title: 'Frontend Specialist', date: '2026-10-01', status: 'Applied' },
          { id: 2, company: 'Microsoft', title: 'React Architect', date: '2026-09-28', status: 'Interview' },
          { id: 3, company: 'Stripe', title: 'Full Stack Engineer', date: '2026-09-15', status: 'Offer' },
        ];
      });

      useEffect(() => {
        localStorage.setItem('careermate_jobs', JSON.stringify(jobs));
      }, [jobs]);

      const [newJob, setNewJob] = useState({ company: '', title: '', status: 'Applied' });
      const [showModal, setShowModal] = useState(false);

      const addJob = (e) => {
        e.preventDefault();
        if (!newJob.company || !newJob.title) return;
        const entry = {
          id: Date.now(),
          ...newJob,
          date: new Date().toISOString().split('T')[0]
        };
        setJobs([entry, ...jobs]);
        setNewJob({ company: '', title: '', status: 'Applied' });
        setShowModal(false);
      };

      // Mock AI state
      const [resumeInput, setResumeInput] = useState('');
      const [resumeOutput, setResumeOutput] = useState('');
      const [isGenerating, setIsGenerating] = useState(false);

      const handleEnhanceResume = () => {
        if (!resumeInput.trim()) return;
        setIsGenerating(true);
        setTimeout(() => {
          setResumeOutput(
            `• Redesigned scalable React dashboard components, improving load performance by 38%.\n` +
            `• Integrated Google Gemini API endpoints to automate customer workflow evaluation.\n` +
            `• Spearheaded cross-functional collaboration, reducing bug ticket backlog by 25%.`
          );
          setIsGenerating(false);
        }, 1200);
      };

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col">
          {/* Header Bar */}
          <header className="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
            <div className="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
              <div 
                onClick={() => setView('landing')} 
                className="flex items-center gap-2.5 cursor-pointer font-bold text-xl tracking-tight text-white"
              >
                <div className="p-2 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 text-white shadow-lg shadow-blue-500/20">
                  <IconBrain className="w-5 h-5" />
                </div>
                CareerMate<span className="text-blue-400">AI</span>
              </div>

              <div className="flex items-center gap-4">
                {view === 'landing' ? (
                  <button 
                    onClick={() => setView('app')}
                    className="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-xl text-sm font-semibold transition-all shadow-lg shadow-blue-600/30 flex items-center gap-2"
                  >
                    Launch Platform <IconSparkles className="w-4 h-4" />
                  </button>
                ) : (
                  <button 
                    onClick={() => setView('landing')}
                    className="text-slate-400 hover:text-white px-4 py-2 text-sm font-medium transition-colors"
                  >
                    Back to Landing
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* LANDING PAGE VIEW */}
          {view === 'landing' && (
            <main className="flex-1 animate-fade-in">
              {/* Hero Section */}
              <section className="py-24 px-6 text-center max-w-4xl mx-auto space-y-8">
                <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-blue-500/10 border border-blue-500/20 text-blue-400 text-xs font-semibold uppercase tracking-wider">
                  <IconSparkles className="w-3.5 h-3.5" /> Next-Gen AI Career Suite
                </div>
                <h1 className="text-5xl md:text-6xl font-extrabold tracking-tight text-white leading-tight">
                  Supercharge your job search with <span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-400">AI Precision</span>
                </h1>
                <p className="text-lg text-slate-400 max-w-2xl mx-auto leading-relaxed">
                  Tailor ATS-optimized resumes, practice real-time role-specific interviews, and organize your job application pipeline in one streamlined platform.
                </p>
                <div className="flex flex-wrap justify-center gap-4 pt-4">
                  <button 
                    onClick={() => { setView('app'); setTab('dashboard'); }}
                    className="bg-blue-600 hover:bg-blue-500 text-white px-8 py-3.5 rounded-xl font-bold text-base transition-all shadow-xl shadow-blue-600/30 flex items-center gap-2"
                  >
                    Open Career App <IconSparkles className="w-5 h-5" />
                  </button>
                </div>
              </section>

              {/* Feature Highlights Grid */}
              <section className="max-w-6xl mx-auto px-6 py-12 grid grid-cols-1 md:grid-cols-3 gap-6">
                {[
                  { icon: <IconFileText className="w-6 h-6 text-blue-400" />, title: "Resume AI Optimizer", desc: "Transform vague bullet points into impactful, high-converting achievement statements." },
                  { icon: <IconMessage className="w-6 h-6 text-indigo-400" />, title: "AI Mock Interviews", desc: "Practice dynamic technical and behavioral interview questions with tailored feedback." },
                  { icon: <IconBriefcase className="w-6 h-6 text-purple-400" />, title: "Application Tracker", desc: "Manage your applications, deadlines, and offer statuses with local sync." }
                ].map((item, i) => (
                  <div key={i} className="p-6 bg-slate-800/50 border border-slate-750 rounded-2xl space-y-3 hover:border-slate-700 transition-colors">
                    <div className="p-3 bg-slate-800 rounded-xl w-fit border border-slate-700">{item.icon}</div>
                    <h3 className="text-xl font-bold text-white">{item.title}</h3>
                    <p className="text-slate-400 text-sm leading-relaxed">{item.desc}</p>
                  </div>
                ))}
              </section>
            </main>
          )}

          {/* APP PORTAL VIEW */}
          {view === 'app' && (
            <div className="flex-1 flex max-w-7xl w-full mx-auto px-6 py-8 gap-8 animate-fade-in">
              {/* Navigation Sidebar */}
              <aside className="w-64 shrink-0 space-y-2">
                {[
                  { id: 'dashboard', label: 'Dashboard', icon: <IconBrain /> },
                  { id: 'resume', label: 'Resume Enhancer', icon: <IconFileText /> },
                  { id: 'tracker', label: 'Application Tracker', icon: <IconBriefcase /> }
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setTab(item.id)}
                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-sm transition-all ${
                      tab === item.id 
                        ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/20' 
                        : 'text-slate-400 hover:bg-slate-800 hover:text-white'
                    }`}
                  >
                    {item.icon}
                    {item.label}
                  </button>
                ))}
              </aside>

              {/* Main Workspace Area */}
              <main className="flex-1 bg-slate-800/40 border border-slate-800 rounded-2xl p-6 min-h-[500px]">
                {tab === 'dashboard' && (
                  <div className="space-y-6">
                    <div className="p-8 rounded-2xl bg-gradient-to-r from-blue-900/60 via-indigo-900/40 to-slate-800 border border-blue-500/20 space-y-3">
                      <h2 className="text-3xl font-extrabold text-white">Welcome to CareerMate AI</h2>
                      <p className="text-slate-300 max-w-xl">Your central hub for optimizing applications and preparing for technical interviews.</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      <div className="p-5 bg-slate-800 border border-slate-750 rounded-xl space-y-1">
                        <span className="text-slate-400 text-xs font-semibold uppercase">Applications</span>
                        <p className="text-3xl font-black text-white">{jobs.length}</p>
                      </div>
                      <div className="p-5 bg-slate-800 border border-slate-750 rounded-xl space-y-1">
                        <span className="text-slate-400 text-xs font-semibold uppercase">Interviews</span>
                        <p className="text-3xl font-black text-blue-400">{jobs.filter(j => j.status === 'Interview').length}</p>
                      </div>
                      <div className="p-5 bg-slate-800 border border-slate-750 rounded-xl space-y-1">
                        <span className="text-slate-400 text-xs font-semibold uppercase">Offers</span>
                        <p className="text-3xl font-black text-emerald-400">{jobs.filter(j => j.status === 'Offer').length}</p>
                      </div>
                    </div>
                  </div>
                )}

                {tab === 'resume' && (
                  <div className="space-y-6">
                    <div>
                      <h2 className="text-2xl font-bold text-white">AI Resume Enhancer</h2>
                      <p className="text-slate-400 text-sm">Paste raw bullet points to generate polished ATS-friendly achievements.</p>
                    </div>

                    <div className="space-y-4">
                      <textarea 
                        rows="4" 
                        value={resumeInput}
                        onChange={(e) => setResumeInput(e.target.value)}
                        placeholder="e.g. Worked on React components and fixed bugs for the web app..."
                        className="w-full p-4 bg-slate-900 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-colors"
                      />
                      <button 
                        onClick={handleEnhanceResume}
                        disabled={isGenerating || !resumeInput.trim()}
                        className="bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white px-6 py-2.5 rounded-xl font-semibold text-sm transition-all flex items-center gap-2"
                      >
                        {isGenerating ? 'Enhancing with AI...' : 'Optimize Bullets'} <IconSparkles className="w-4 h-4" />
                      </button>
                    </div>

                    {resumeOutput && (
                      <div className="p-5 bg-slate-900/80 border border-blue-500/30 rounded-xl space-y-2">
                        <span className="text-xs font-bold text-blue-400 uppercase tracking-wider">AI Suggestions</span>
                        <pre className="whitespace-pre-wrap text-slate-200 text-sm font-sans leading-relaxed">{resumeOutput}</pre>
                      </div>
                    )}
                  </div>
                )}

                {tab === 'tracker' && (
                  <div className="space-y-6">
                    <div className="flex justify-between items-center">
                      <div>
                        <h2 className="text-2xl font-bold text-white">Job Tracker</h2>
                        <p className="text-slate-400 text-sm">Manage active job submissions and timeline progression.</p>
                      </div>
                      <button 
                        onClick={() => setShowModal(true)}
                        className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2"
                      >
                        <IconPlus className="w-4 h-4" /> Add Application
                      </button>
                    </div>

                    <div className="overflow-x-auto">
                      <table className="w-full text-left border-collapse">
                        <thead>
                          <tr className="border-b border-slate-750 text-slate-400 text-xs uppercase tracking-wider">
                            <th className="py-3 px-4">Company</th>
                            <th className="py-3 px-4">Role</th>
                            <th className="py-3 px-4">Date</th>
                            <th className="py-3 px-4">Status</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800">
                          {jobs.map(j => (
                            <tr key={j.id} className="hover:bg-slate-800/40 text-sm">
                              <td className="py-3.5 px-4 font-semibold text-white">{j.company}</td>
                              <td className="py-3.5 px-4 text-slate-300">{j.title}</td>
                              <td className="py-3.5 px-4 text-slate-400">{j.date}</td>
                              <td className="py-3.5 px-4">
                                <span className={`px-2.5 py-1 rounded-full text-xs font-semibold ${
                                  j.status === 'Offer' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' :
                                  j.status === 'Interview' ? 'bg-blue-500/10 text-blue-400 border border-blue-500/20' :
                                  'bg-slate-700/50 text-slate-300'
                                }`}>
                                  {j.status}
                                </span>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}
              </main>
            </div>
          )}

          {/* Add Job Modal */}
          {showModal && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <form onSubmit={addJob} className="bg-slate-800 border border-slate-700 rounded-2xl p-6 max-w-md w-full space-y-4">
                <h3 className="text-xl font-bold text-white">Add New Job Application</h3>
                <input 
                  type="text" 
                  placeholder="Company Name" 
                  value={newJob.company}
                  onChange={(e) => setNewJob({...newJob, company: e.target.value})}
                  className="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white outline-none focus:border-blue-500"
                  required
                />
                <input 
                  type="text" 
                  placeholder="Role Title" 
                  value={newJob.title}
                  onChange={(e) => setNewJob({...newJob, title: e.target.value})}
                  className="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white outline-none focus:border-blue-500"
                  required
                />
                <select 
                  value={newJob.status}
                  onChange={(e) => setNewJob({...newJob, status: e.target.value})}
                  className="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white outline-none focus:border-blue-500"
                >
                  <option value="Applied">Applied</option>
                  <option value="Interview">Interview Scheduled</option>
                  <option value="Offer">Offer Extended</option>
                  <option value="Rejected">Rejected</option>
                </select>
                <div className="flex gap-3 justify-end pt-2">
                  <button type="button" onClick={() => setShowModal(false)} className="px-4 py-2 text-slate-400 hover:text-white">Cancel</button>
                  <button type="submit" className="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-xl font-semibold">Save Job</button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
